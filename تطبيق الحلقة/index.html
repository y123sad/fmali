<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>الحلقة المنزلية</title>
<meta name="theme-color" content="#0a84ff">
<link rel="manifest" href='data:application/manifest+json,{"name":"الحلقة المنزلية","short_name":"الحلقة","start_url":"/","display":"standalone","background_color":"#f5f5f7","theme_color":"#0a84ff","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 512 512%27%3E%3Crect width=%27512%27 height=%27512%27 rx=%27110%27 fill=%27%230a84ff%27/%3E%3Ctext x=%27256%27 y=%27360%27 font-size=%27280%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27serif%27%3Eح%3C/text%3E%3C/svg%3E","sizes":"512x512","type":"image/svg+xml","purpose":"any maskable"}]}'>
<style>
/* ================= المتغيرات ================= */
:root{
  --bg:#f5f5f7; --bg-elev:#ffffff; --text:#1d1d1f; --muted:#6e6e73;
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.12);
  --green:#30d158; --red:#ff453a; --border:rgba(0,0,0,.06);
  --glass:rgba(255,255,255,.72); --glass-border:rgba(255,255,255,.6);
  --shadow:0 8px 32px rgba(0,0,0,.08); --radius:20px;
  --ease:cubic-bezier(.32,.72,0,1);
}
[data-theme="dark"]{
  --bg:#000; --bg-elev:#1c1c1e; --text:#f5f5f7; --muted:#98989d;
  --border:rgba(255,255,255,.1); --glass:rgba(28,28,30,.72);
  --glass-border:rgba(255,255,255,.08); --shadow:0 8px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Tajawal','Cairo',sans-serif;
  background:var(--bg);color:var(--text);min-height:100dvh;
  transition:background .4s var(--ease),color .4s var(--ease);
  overflow-x:hidden;
}
/* خلفية متدرجة ناعمة */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(circle at 20% 0%, rgba(10,132,255,.10), transparent 40%),
    radial-gradient(circle at 80% 100%, rgba(48,209,88,.08), transparent 40%);
  transition:opacity .4s;
}
[data-theme="dark"] body::before{opacity:.6}
svg{display:block;flex-shrink:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}

/* ================= الحاوية ================= */
.app{max-width:820px;margin:0 auto;padding:16px;padding-bottom:96px;min-height:100dvh}
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0 16px;position:sticky;top:0;z-index:50;
  background:linear-gradient(to bottom,var(--bg) 60%,transparent);
  backdrop-filter:blur(8px);
}
header h1{font-size:22px;font-weight:700;letter-spacing:-.5px}
.icon-btn{
  width:42px;height:42px;border-radius:50%;background:var(--glass);
  border:1px solid var(--glass-border);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  display:grid;place-items:center;transition:transform .2s var(--ease),background .2s;
  color:var(--text);
}
.icon-btn:active{transform:scale(.92)}

/* ================= بطاقات زجاجية ================= */
.glass{
  background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-radius:var(--radius);box-shadow:var(--shadow);
}
.card{padding:20px;margin-bottom:14px}

/* ================= أزرار ================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:999px;font-size:15px;font-weight:600;
  background:var(--accent);color:#fff;
  transition:transform .15s var(--ease),opacity .15s,box-shadow .2s;
  box-shadow:0 4px 16px rgba(10,132,255,.3);
}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;pointer-events:none;box-shadow:none}
.btn.secondary{
  background:var(--glass);color:var(--text);
  border:1px solid var(--glass-border);backdrop-filter:blur(20px);
  box-shadow:0 4px 16px rgba(0,0,0,.04);
}
.btn.danger{background:var(--red);box-shadow:0 4px 16px rgba(255,69,58,.3)}
.btn.green{background:var(--green);box-shadow:0 4px 16px rgba(48,209,88,.3)}
.btn.full{width:100%}

/* ================= مدخلات ================= */
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
input,select{
  width:100%;padding:14px 16px;border-radius:14px;
  border:1px solid var(--border);background:var(--bg-elev);color:var(--text);
  font-size:16px;transition:border .2s,box-shadow .2s;
}
input:focus,select:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}

/* ================= الصفحات والتنقل ================= */
.page{display:none;animation:pageIn .35s var(--ease)}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:var(--glass);border-top:1px solid var(--glass-border);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  max-width:820px;margin:0 auto;
}
.bottom-nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 16px;border-radius:14px;font-size:11px;color:var(--muted);
  transition:color .2s,transform .2s var(--ease),background .2s;
  font-weight:500;flex:1;max-width:120px;
}
.bottom-nav button svg{width:22px;height:22px}
.bottom-nav button.active{color:var(--accent)}
.bottom-nav button:active{transform:scale(.92)}

/* ================= قائمة السور ================= */
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-wrap input{padding-right:48px}

.surah-list{display:grid;gap:10px}
.surah-item{
  display:flex;align-items:center;gap:14px;padding:16px;
  cursor:pointer;transition:transform .2s var(--ease),background .2s;
  animation:surahIn .4s var(--ease) backwards;
}
.surah-item:hover{background:var(--glass)}
.surah-item:active{transform:scale(.98)}
@keyframes surahIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.surah-num{
  width:44px;height:44px;border-radius:14px;flex-shrink:0;
  display:grid;place-items:center;font-size:14px;font-weight:700;
  background:var(--accent-soft);color:var(--accent);
  position:relative;overflow:hidden;
}
.surah-num::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--accent),transparent);
  opacity:0;transition:opacity .3s;
}
.surah-item:hover .surah-num::before{opacity:.15}
.surah-info{flex:1;min-width:0}
.surah-name{font-weight:700;font-size:17px;margin-bottom:3px}
.surah-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.surah-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}
.surah-chevron{color:var(--muted);transition:transform .2s}
.surah-item:active .surah-chevron{transform:translateX(-4px)}

/* ================= عرض السورة (المصحف) ================= */
.surah-header{
  text-align:center;padding:24px 16px;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.surah-header::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(10,132,255,.08),transparent);
}
.surah-header h2{font-size:26px;font-weight:700;margin-bottom:6px;position:relative;font-family:'Amiri','Scheherazade',serif}
.surah-header .bismillah{
  font-family:'Amiri','Scheherazade','Traditional Arabic',serif;
  font-size:20px;color:var(--muted);margin-top:12px;
}
.ayahs{display:flex;flex-direction:column;gap:4px}
.ayah{
  font-family:'Amiri','Scheherazade','Traditional Arabic',serif;
  font-size:26px;line-height:2.4;padding:20px 24px;
  border-radius:16px;cursor:pointer;position:relative;
  transition:background .2s,transform .15s var(--ease);
  text-align:justify;text-align-last:right;
  word-spacing:2px;
}
.ayah:hover{background:var(--accent-soft)}
.ayah:active{transform:scale(.99)}
.ayah.playing{
  background:var(--accent-soft);
  box-shadow:inset 4px 0 0 var(--accent);
  animation:ayahPulse 1.6s ease-in-out infinite;
}
@keyframes ayahPulse{0%,100%{background:var(--accent-soft)}50%{background:rgba(10,132,255,.18)}}
.ayah-num{
  display:inline-grid;place-items:center;
  width:32px;height:32px;margin:0 8px;vertical-align:middle;
  font-family:system-ui;font-size:13px;font-weight:700;
  color:var(--accent);position:relative;
}
.ayah-num::before{
  content:'';position:absolute;inset:0;
  border:2px solid var(--accent);border-radius:50%;
  opacity:.4;
}
.ayah-num::after{
  content:'';position:absolute;inset:4px;
  border:1.5px solid var(--accent);border-radius:50%;
  opacity:.25;
}
.ayah-text{display:inline}

/* ================= الحلقة ================= */
.room-input-row{display:flex;gap:8px;margin-bottom:12px}
.room-input-row input{margin:0;font-family:ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase;text-align:center;font-weight:600}

/* ================= واجهة المكالمة ================= */
.call-overlay{
  position:fixed;inset:0;z-index:1000;
  background:linear-gradient(160deg,#1a1a1c 0%,#000 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;color:#fff;
}
.call-overlay.active{display:flex;animation:callIn .4s var(--ease)}
@keyframes callIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
.call-overlay::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 30%,rgba(10,132,255,.2),transparent 60%);
  pointer-events:none;
}
.call-room-info{text-align:center;margin-bottom:32px;position:relative;z-index:1}
.call-room-info h2{font-size:22px;margin-bottom:6px}
.call-room-info .status{font-size:13px;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:6px;justify-content:center}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:dotPulse 1.5s infinite}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

.avatars{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin:16px 0 32px;position:relative;z-index:1}
.avatar{
  width:88px;height:88px;border-radius:50%;position:relative;
  background:linear-gradient(135deg,var(--accent),#5e5ce6);
  display:grid;place-items:center;font-size:32px;font-weight:700;
  box-shadow:0 8px 32px rgba(10,132,255,.4);
  animation:avatarIn .5s var(--ease) backwards;
  overflow:hidden;
}
@keyframes avatarIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.avatar.connecting{animation:avatarIn .5s var(--ease) backwards,avatarPulse 1.5s infinite}
@keyframes avatarPulse{0%,100%{box-shadow:0 8px 32px rgba(10,132,255,.4)}50%{box-shadow:0 8px 32px rgba(10,132,255,.8),0 0 0 4px rgba(10,132,255,.2)}}
.avatar video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.avatar-name{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.7)}
.avatar .mic-badge{
  position:absolute;bottom:2px;left:2px;width:26px;height:26px;border-radius:50%;
  background:var(--red);display:grid;place-items:center;
  border:2px solid #000;
}
.avatar .mic-badge.on{background:var(--green)}

.call-timer{font-size:14px;color:rgba(255,255,255,.5);font-family:ui-monospace,monospace;letter-spacing:1px;position:relative;z-index:1}

.call-controls{display:flex;gap:20px;margin-top:40px;position:relative;z-index:1}
.call-controls button{
  width:64px;height:64px;border-radius:50%;
  display:grid;place-items:center;
  transition:transform .2s var(--ease),background .2s;
  background:rgba(255,255,255,.15);color:#fff;backdrop-filter:blur(20px);
}
.call-controls button:active{transform:scale(.9)}
.call-controls button svg{width:26px;height:26px}
.call-controls button.off{background:var(--red)}
.call-controls button.end{background:var(--red);width:72px;height:72px}
.call-controls button.end svg{width:30px;height:30px;transform:rotate(135deg)}

/* ================= الإشعارات ================= */
.toast{
  position:fixed;top:24px;left:50%;transform:translate(-50%,-100px);
  padding:14px 24px;border-radius:999px;background:rgba(30,30,32,.95);
  color:#fff;font-size:14px;font-weight:500;z-index:3000;
  backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,.3);
  transition:transform .4s var(--ease);pointer-events:none;
  display:flex;align-items:center;gap:8px;max-width:90vw;
}
.toast.show{transform:translate(-50%,0)}
.toast svg{width:18px;height:18px}

/* ================= حالات فارغة ================= */
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty svg{width:56px;height:56px;margin:0 auto 16px;opacity:.4}
.empty p{font-size:15px}

/* ================= Spinner ================= */
.spinner{
  width:20px;height:20px;border:2.5px solid rgba(255,255,255,.25);
  border-top-color:currentColor;border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner.dark{border-color:rgba(0,0,0,.15);border-top-color:var(--accent)}

/* ================= إخفاء ================= */
.hidden{display:none!important}

/* ================= استجابة ================= */
@media(max-width:500px){
  .ayah{font-size:23px;padding:16px 18px;line-height:2.3}
  .call-controls button{width:60px;height:60px}
  .call-controls button.end{width:68px;height:68px}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1 id="page-title">الحلقة المنزلية</h1>
    <button class="icon-btn" onclick="toggleTheme()" id="theme-btn" aria-label="تبديل المظهر"></button>
  </header>

  <!-- شريط إذن الإشعارات -->
  <div class="glass card hidden" id="notif-banner" style="padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div style="display:flex;align-items:center;gap:12px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <div style="font-size:14px">فعّل الإشعارات لتصلك تنبيهات الحلقات</div>
      </div>
      <button class="btn" onclick="requestNotifPermission()" style="flex-shrink:0;padding:10px 16px">تفعيل</button>
    </div>
  </div>

  <!-- ============ صفحة المصحف ============ -->
  <div class="page active" id="page-quran">
    <div id="surah-list-view">
      <div class="search-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="surah-search" placeholder="ابحث عن سورة..." oninput="filterSurahs()">
      </div>
      <div class="surah-list" id="surah-list">
        <div class="empty"><div class="spinner dark"></div></div>
      </div>
    </div>
    <div id="surah-view" class="hidden">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <button class="icon-btn" onclick="showSurahList()" aria-label="رجوع">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <div style="flex:1"></div>
        <button class="icon-btn" onclick="stopAudio()" id="stop-audio-btn" style="display:none" aria-label="إيقاف الصوت">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
      <div class="glass surah-header" id="surah-header"></div>
      <div class="ayahs" id="ayahs-container"></div>
    </div>
  </div>

  <!-- ============ صفحة الحلقة ============ -->
  <div class="page" id="page-halaqa">
    <div class="glass card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <div class="icon-btn" style="background:var(--accent-soft);color:var(--accent);pointer-events:none">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        </div>
        <div>
          <h3 style="font-size:17px;margin-bottom:2px">حلقة مباشرة</h3>
          <p style="color:var(--muted);font-size:13px">انضم أو أنشئ حلقة</p>
        </div>
      </div>
      <div class="field">
        <label>رمز الغرفة</label>
        <div class="room-input-row">
          <input type="text" id="room-code-input" placeholder="ABCDEF" maxlength="6">
          <button class="btn" onclick="joinRoom()" style="flex-shrink:0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
            انضم
          </button>
        </div>
      </div>
      <button class="btn secondary full" onclick="createRoom()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
        إنشاء حلقة جديدة
      </button>
    </div>
    <div class="glass card" style="padding:16px">
      <div style="display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span>ملاحظة: الاتصال يعمل بين الأجهزة عبر خادم signaling</span>
      </div>
      <div id="connection-status" style="font-size:13px;color:var(--muted)">الحالة: غير متصل</div>
    </div>
  </div>

  <!-- ============ صفحة الإعدادات ============ -->
  <div class="page" id="page-settings">
    <div class="glass card">
      <h3 style="font-size:17px;margin-bottom:4px;display:flex;align-items:center;gap:8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        الإشعارات
      </h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px">جرّب إرسال إشعار. على Android تظهر الأزرار، على iOS لا (حد نظام).</p>
      <button class="btn full" onclick="testNotification('halaqa')" style="margin-bottom:10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
        إشعار "بدأت الحلقة"
      </button>
      <button class="btn secondary full" onclick="testNotification('wird')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        إشعار "وردك اليوم"
      </button>
    </div>
    <div class="glass card">
      <h3 style="font-size:17px;margin-bottom:16px;display:flex;align-items:center;gap:8px">

    </button>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   1. الحالة العامة
   ================================================================ */
const state = {
  surahs: [],
  currentSurah: null,
  theme: localStorage.getItem('theme') || 'light',
  roomCode: null,
  localStream: null,
  peers: {},          // peerId -> { pc, name }
  ws: null,
  myPeerId: Math.random().toString(36).substring(2, 10),
  micOn: true,
  camOn: false,
  currentAudio: null,
  callStartTime: null,
  timerInterval: null,
};

const SIGNALING_URL = localStorage.getItem('signaling_url') || 'wss://YOUR-SERVER.onrender.com';

/* ================================================================
   2. أيقونات
   ================================================================ */
const ICONS = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>',
  chevronLeft: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
};
document.getElementById('theme-btn').innerHTML = state.theme === 'dark' ? ICONS.sun : ICONS.moon;
document.documentElement.setAttribute('data-theme', state.theme);

/* ================================================================
   3. أدوات مساعدة
   ================================================================ */
function toast(msg, icon = 'check', duration = 2500) {
  const t = document.getElementById('toast');
  t.innerHTML = (ICONS[icon] || '') + '<span>' + msg + '</span>';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('theme-btn').innerHTML = state.theme === 'dark' ? ICONS.sun : ICONS.moon;
  localStorage.setItem('theme', state.theme);
}

function nav(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  const titles = { quran: 'المصحف', halaqa: 'الحلقة', settings: 'الإعدادات' };
  document.getElementById('page-title').textContent = titles[page] || 'الحلقة المنزلية';
}

/* ================================================================
   4. المصحف (Quran.com API)
   ================================================================ */
async function loadSurahs() {
  const cached = localStorage.getItem('surahs_cache_v2');
  if (cached) { state.surahs = JSON.parse(cached); renderSurahList(); return; }
  try {
    const res = await fetch('https://api.quran.com/api/v4/chapters?language=ar');
    const data = await res.json();
    state.surahs = data.chapters.map(c => ({
      id: c.id, name: c.name_arabic, english: c.name_simple,
      verses: c.verses_count,
      type: c.revelation_place === 'makkah' ? 'مكية' : 'مدنية',
      bismillah: c.bismillah_pre
    }));
    localStorage.setItem('surahs_cache_v2', JSON.stringify(state.surahs));
    renderSurahList();
  } catch (e) {
    document.getElementById('surah-list').innerHTML =
      '<div class="glass card empty"><p>تعذر تحميل قائمة السور. تحقق من الاتصال.</p></div>';
  }
}

function renderSurahList(filter = '') {
  const list = document.getElementById('surah-list');
  const q = filter.trim().toLowerCase();
  const filtered = state.surahs.filter(s =>
    !q || s.name.includes(filter) || s.english.toLowerCase().includes(q) || String(s.id) === filter
  );
  if (!filtered.length) {
    list.innerHTML = '<div class="glass card empty"><p>لا توجد نتائج</p></div>';
    return;
  }
  list.innerHTML = filtered.map((s, i) => `
    <div class="glass surah-item" style="animation-delay:${Math.min(i * 20, 300)}ms" onclick="openSurah(${s.id})">
      <div class="surah-num">${s.id}</div>
      <div class="surah-info">
        <div class="surah-name">${s.name}</div>
        <div class="surah-meta">
          <span>${s.type}</span><span class="dot"></span><span>${s.verses} آية</span>
        </div>
      </div>
      <div class="surah-chevron">${ICONS.chevronLeft}</div>
    </div>
  `).join('');
}

function filterSurahs() {
  renderSurahList(document.getElementById('surah-search').value);
}

async function openSurah(id) {
  const surah = state.surahs.find(s => s.id === id);
  if (!surah) return;
  state.currentSurah = surah;
  document.getElementById('surah-list-view').classList.add('hidden');
  document.getElementById('surah-view').classList.remove('hidden');

  document.getElementById('surah-header').innerHTML = `
    <h2>سورة ${surah.name}</h2>
    <div class="surah-meta" style="justify-content:center;margin-top:8px">
      <span>${surah.type}</span><span class="dot"></span><span>${surah.verses} آية</span>
    </div>
    ${surah.bismillah && surah.id !== 1 && surah.id !== 9 ? '<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>' : ''}
  `;

  const container = document.getElementById('ayahs-container');
  container.innerHTML = '<div class="empty"><div class="spinner dark" style="margin:0 auto"></div></div>';

  try {
    const res = await fetch(`https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number=${id}`);
    const data = await res.json();
    container.innerHTML = data.verses.map((v, i) => `
      <div class="ayah" data-ayah="${i + 1}" onclick="playAyah(${id}, ${i + 1})" style="animation:pageIn .3s ${i * 15}ms backwards">
        <span class="ayah-text">${v.text_uthmani}</span>
        <span class="ayah-num">${i + 1}</span>
      </div>
    `).join('');
    localStorage.setItem('last_surah', id);
    localStorage.setItem('last_surah_time', Date.now());
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    container.innerHTML = '<div class="glass card empty"><p>تعذر تحميل السورة</p></div>';
  }
}

function showSurahList() {
  stopAudio();
  document.getElementById('surah-view').classList.add('hidden');
  document.getElementById('surah-list-view').classList.remove('hidden');
}

async function playAyah(surahId, ayahNum) {
  document.querySelectorAll('.ayah').forEach(a => a.classList.remove('playing'));
  const el = document.querySelector(`.ayah[data-ayah="${ayahNum}"]`);
  if (el) {
    el.classList.add('playing');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  stopAudio();
  document.getElementById('stop-audio-btn').style.display = 'grid';
  try {
    const res = await fetch(`https://api.quran.com/api/v4/recitations/7/by_ayah/${surahId}:${ayahNum}?language=ar`);
    const data = await res.json();
    const url = data.audio_files?.[0]?.url;
    if (!url) { toast('التلاوة غير متاحة', 'x'); return; }
    const audio = new Audio(url);
    state.currentAudio = audio;
    audio.play().catch(() => toast('تعذر تشغيل الصوت', 'x'));
    audio.onended = () => {
      if (el) el.classList.remove('playing');
      document.getElementById('stop-audio-btn').style.display = 'none';
      state.currentAudio = null;
    };
  } catch (e) {
    toast('تعذر تشغيل التلاوة', 'x');
  }
}

function stopAudio() {
  if (state.currentAudio) {
    state.currentAudio.pause();
    state.currentAudio = null;
  }
  document.querySelectorAll('.ayah.playing').forEach(a => a.classList.remove('playing'));
  document.getElementById('stop-audio-btn').style.display = 'none';
}

/* ================================================================
   5. الإشعارات
   ================================================================ */
async function requestNotifPermission() {
  if (!('Notification' in window)) { toast('الإشعارات غير مدعومة', 'x'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    document.getElementById('notif-banner').classList.add('hidden');
    toast('تم تفعيل الإشعارات');
    showNotification({ title: 'الحلقة المنزلية', body: 'تم تفعيل الإشعارات بنجاح', tag: 'welcome' });
  } else {
    toast('لم يتم منح الإذن', 'x');
  }
}

function checkNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    document.getElementById('notif-banner').classList.remove('hidden');
  }
}

async function showNotification({ title, body, tag, actions, data }) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const reg = await navigator.serviceWorker.ready;
  const options = {
    body, tag,
    icon: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="#0a84ff" width="100" height="100" rx="20"/><text x="50" y="68" font-size="50" text-anchor="middle" fill="#fff" font-family="serif">ح</text></svg>'),
    badge: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="#0a84ff" width="100" height="100" rx="20"/></svg>'),
    data: data || {},
  };
  if (actions && Notification.maxActions > 0) options.actions = actions.slice(0, Notification.maxActions);
  await reg.showNotification(title, options);
}

async function testNotification(type) {
  if (Notification.permission !== 'granted') {
    await requestNotifPermission();
    if (Notification.permission !== 'granted') return;
  }
  if (type === 'halaqa') {
    await showNotification({
      title: 'بدأت الحلقة الآن',
      body: 'حلقتك القرآنية بدأت، اضغط للانضمام.',
      tag: 'halaqa-start',
      actions: [{ action: 'join', title: 'انضم الآن' }, { action: 'dismiss', title: 'لاحقاً' }],
      data: { type: 'halaqa', room: state.roomCode || 'DEMO01' }
    });
  } else {
    await showNotification({
      title: 'وردك اليوم نسيته؟',
      body: 'لم تقرأ وردك اليوم بعد. اقرأه الآن.',
      tag: 'daily-wird',
      actions: [{ action: 'read', title: 'اقرأه الآن' }, { action: 'dismiss', title: 'تخطي' }],
      data: { type: 'wird', surah: localStorage.getItem('last_surah') || 1 }
    });
  }
  toast('تم إرسال الإشعار');
}

/* ================================================================
   6. Service Worker
   ================================================================ */
async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  const swCode = `
const CACHE = 'halaqa-v2';
self.addEventListener('install', e => self.skipWaiting());
self.addEventListener('activate', e => e.waitUntil(clients.claim()));

self.addEventListener('notificationclick', event => {
  event.notification.close();
  const data = event.notification.data || {};
  if (event.action === 'dismiss') return;
  let targetUrl = '/';
  if (data.type === 'halaqa') targetUrl = '/?join=' + (data.room || '');
  else if (data.type === 'wird') targetUrl = '/?surah=' + (data.surah || 1);
  event.waitUntil(
    clients.matchAll({ type: 'window', includeUncontrolled: true }).then(list => {
      for (const c of list) {
        if ('focus' in c) {
          c.focus();
          c.postMessage({ type: 'navigate', url: targetUrl });
          return;
        }
      }
      return clients.openWindow(targetUrl);
    })
  );
});
`;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  try {
    const reg = await navigator.serviceWorker.register(url);
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data?.type === 'navigate') handleDeepLink(e.data.url);
    });
  } catch (e) { console.warn('SW failed', e); }
}

function handleDeepLink(url) {
  const params = new URL(url, location.origin).searchParams;
  if (params.has('join')) {
    const room = params.get('join');
    if (room) { nav('halaqa'); document.getElementById('room-code-input').value = room; }
  } else if (params.has('surah')) {
    nav('quran');
    const s = parseInt(params.get('surah'));
    const tryOpen = () => state.surahs.length ? openSurah(s) : setTimeout(tryOpen, 500);
    tryOpen();
  }
}

/* ================================================================
   7. الاتصال (WebRTC + Signaling)
   ================================================================ */
function createRoom() {
  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  state.roomCode = code;
  document.getElementById('room-code-input').value = code;
  toast('تم إنشاء الغرفة: ' + code);
  startCall();
}

function joinRoom() {
  const code = document.getElementById('room-code-input').value.trim().toUpperCase();
  if (!code || code.length < 3) { toast('أدخل رمزاً صحيحاً', 'x'); return; }
  state.roomCode = code;
  startCall();
}

async function startCall() {
  document.getElementById('call-overlay').classList.add('active');
  document.getElementById('call-room-name').textContent = 'غرفة: ' + state.roomCode;
  setCallStatus('جارٍ طلب الأذونات...');

  // طلب الأذونات
  try {
    state.localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false
    });
  } catch (e) {
    console.error('getUserMedia failed', e);
    setCallStatus('فشل الوصول للميكروفون');
    toast('تم رفض إذن الميكروفون', 'x');
    setTimeout(leaveCall, 1500);
    return;
  }

  // أفاتار محلي
  addAvatar(state.myPeerId, 'أنت', state.localStream, true);

  // اتصل بالخادم
  setCallStatus('جارٍ الاتصال بالخادم...');
  connectSignaling();

  startTimer();
}

function connectSignaling() {
  try {
    state.ws = new WebSocket(SIGNALING_URL);
  } catch (e) {
    setCallStatus('تعذر الاتصال بالخادم');
    toast('تحقق من عنوان خادم signaling', 'x');
    return;
  }

  state.ws.onopen = () => {
    setCallStatus('متصل، انتظار المشاركين');
    document.getElementById('connection-status').textContent = 'الحالة: متصل بالخادم';
    state.ws.send(JSON.stringify({
      type: 'join',
      room: state.roomCode,
      peerId: state.myPeerId
    }));
  };

  state.ws.onmessage = async (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }
    await handleSignalingMessage(msg);
  };

  state.ws.onerror = () => {
    setCallStatus('خطأ في الاتصال');
    toast('فشل الاتصال بخادم signaling', 'x');
  };

  state.ws.onclose = () => {
    setCallStatus('انقطع الاتصال');
    document.getElementById('connection-status').textContent = 'الحالة: غير متصل';
  };
}

async function handleSignalingMessage(msg) {
  switch (msg.type) {
    case 'peers':
      // قائمة المشاركين الحاليين — أنشئ اتصالاً بكل منهم
      for (const peerId of msg.peers) {
        if (peerId === state.myPeerId) continue;
        const pc = createPeerConnection(peerId);
        // نحن المبادرون: أنشئ offer
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        sendSignal({ type: 'offer', to: peerId, sdp: offer });
      }
      break;

    case 'peer-joined':
      // مشارك جديد — سنستقبل منه offer
      addAvatar(msg.peerId, 'مشارك', null, false);
      break;

    case 'peer-left':
      removePeer(msg.peerId);
      break;

    case 'offer': {
      const pc = createPeerConnection(msg.from);
      await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      sendSignal({ type: 'answer', to: msg.from, sdp: answer });
      break;
    }

    case 'answer': {
      const peer = state.peers[msg.from];
      if (peer) await peer.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
      break;
    }

    case 'ice': {
      const peer = state.peers[msg.from];
      if (peer && msg.candidate) {
        try { await peer.pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); }
        catch (e) { console.warn('ICE add failed', e); }
      }
      break;
    }
  }
}

function sendSignal(obj) {
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    state.ws.send(JSON.stringify({ ...obj, from: state.myPeerId, room: state.roomCode }));
  }
}

function createPeerConnection(peerId) {
  if (state.peers[peerId]) return state.peers[peerId].pc;

  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' }
      // TURN: أضف هنا للإنتاج
    ]
  });

  state.peers[peerId] = { pc, name: 'مشارك' };

  // أضف tracks المحلية
  state.localStream.getTracks().forEach(track => pc.addTrack(track, state.localStream));

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      sendSignal({ type: 'ice', to: peerId, candidate: e.candidate });
    }
  };

  pc.ontrack = (e) => {
    const stream = e.streams[0];
    const existing = document.querySelector(`.avatar[data-peer="${peerId}"]`);
    if (existing) {
      // أضف/حدّث الفيديو
      let video = existing.querySelector('video');
      if (!video) {
        video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        video.muted = true;
        existing.appendChild(video);
      }
      video.srcObject = stream;
    } else {
      addAvatar(peerId, 'مشارك', stream, false);
    }
    setCallStatus('متصل');
  };

  pc.onconnectionstatechange = () => {
    console.log('Connection state', peerId, pc.connectionState);
    if (pc.connectionState === 'connected') {
      setCallStatus('متصل');
      const av = document.querySelector(`.avatar[data-peer="${peerId}"]`);
      if (av) av.classList.remove('connecting');
    } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      setCallStatus('انقطع الاتصال');
    }
  };

  return pc;
}

function addAvatar(peerId, name, stream, isLocal) {
  const container = document.getElementById('call-avatars');
  if (container.querySelector(`.avatar[data-peer="${peerId}"]`)) return;

  const div = document.createElement('div');
  div.className = 'avatar connecting';
  div.dataset.peer = peerId;
  div.textContent = name.charAt(0);
  div.innerHTML += `
    <div class="mic-badge on">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
    </div>
    <div class="avatar-name">${isLocal ? 'أنت' : name}</div>
  `;

  // فيديو محلي
  if (stream && stream.getVideoTracks().length) {
    const video = document.createElement('video');
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;
    video.srcObject = stream;
    div.appendChild(video);
  }

  container.appendChild(div);
}

function removePeer(peerId) {
  if (state.peers[peerId]) {
    state.peers[peerId].pc.close();
    delete state.peers[peerId];
  }
  const av = document.querySelector(`.avatar[data-peer="${peerId}"]`);
  if (av) {
    av.style.animation = 'avatarIn .3s reverse';
    setTimeout(() => av.remove(), 300);
  }
}

function toggleMic() {
  if (!state.localStream) return;
  state.micOn = !state.micOn;
  state.localStream.getAudioTracks().forEach(t => t.enabled = state.micOn);
  const btn = document.getElementById('btn-mic');
  btn.classList.toggle('off', !state.micOn);
  const badge = document.querySelector('.avatar[data-peer="' + state.myPeerId + '"] .mic-badge');
  if (badge) badge.classList.toggle('on', state.micOn);
  toast(state.micOn ? 'تم تشغيل الميكروفون' : 'تم كتم الميكروفون');
}

async function toggleCam() {
  if (!state.localStream) return;
  const btn = document.getElementById('btn-cam');

  if (!state.camOn) {
    try {
      const camStream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
      });
      const track = camStream.getVideoTracks()[0];
      state.localStream.addTrack(track);
      state.camOn = true;
      btn.classList.remove('off');

      // أضف track لكل اتصال + أعد التفاوض
      for (const [peerId, peer] of Object.entries(state.peers)) {
        peer.pc.addTrack(track, state.localStream);
        await renegotiate(peerId, peer.pc);
      }

      // اعرض الفيديو المحلي
      const myAvatar = document.querySelector(`.avatar[data-peer="${state.myPeerId}"]`);
      if (myAvatar) {
        let video = myAvatar.querySelector('video');
        if (!video) {
          video = document.createElement('video');
          video.autoplay = true; video.playsInline = true; video.muted = true;
          myAvatar.insertBefore(video, myAvatar.firstChild);
        }
        video.srcObject = state.localStream;
      }
      toast('تم تشغيل الكاميرا');
    } catch (e) {
      console.error(e);
      toast('تعذر تشغيل الكاميرا', 'x');
    }
  } else {
    // أوقف الكاميرا
    state.localStream.getVideoTracks().forEach(t => {
      t.stop();
      state.localStream.removeTrack(t);
      for (const peer of Object.values(state.peers)) {
        const sender = peer.pc.getSenders().find(s => s.track === t);
        if (sender) peer.pc.removeTrack(sender);
      }
    });
    state.camOn = false;
    btn.classList.add('off');
    const myAvatar = document.querySelector(`.avatar[data-peer="${state.myPeerId}"] video`);
    if (myAvatar) myAvatar.remove();
    for (const peerId of Object.keys(state.peers)) {
      await renegotiate(peerId, state.peers[peerId].pc);
    }
    toast('تم إيقاف الكاميرا');
  }
}

async function renegotiate(peerId, pc) {
  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal({ type: 'offer', to: peerId, sdp: offer });
  } catch (e) {
    console.warn('Renegotiation failed', e);
  }
}

function leaveCall() {
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    state.ws.send(JSON.stringify({ type: 'leave', from: state.myPeerId, room: state.roomCode }));
    state.ws.close();
  }
  Object.values(state.peers).forEach(p => p.pc.close());
  state.peers = {};
  if (state.localStream) {
    state.localStream.getTracks().forEach(t => t.stop());
    state.localStream = null;
  }
  document.getElementById('call-overlay').classList.remove('active');
  document.getElementById('call-avatars').innerHTML = '';
  clearInterval(state.timerInterval);
  state.roomCode = null;
  state.camOn = false;
  state.micOn = true;
  document.getElementById('btn-cam').classList.add('off');
  document.getElementById('btn-mic').classList.remove('off');
  document.getElementById('connection-status').textContent = 'الحالة: غير متصل';
  toast('غادرت الحلقة');
}

function setCallStatus(text) {
  document.getElementById('call-status').textContent = text;
}

function startTimer() {
  state.callStartTime = Date.now();
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    const sec = Math.floor((Date.now() - state.callStartTime) / 1000);
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    document.getElementById('call-timer').textContent = m + ':' + s;
  }, 1000);
}

/* ================================================================
   8. التهيئة
   ================================================================ */
async function init() {
  await registerSW();
  checkNotifPermission();
  await loadSurahs();
  if (location.search) handleDeepLink(location.href);
}

init();
</script>
